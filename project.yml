name: SamsungDisplay
options:
  bundleIdPrefix: com.fp
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
fileGroups:
  - Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  SamsungDisplay:
    type: application
    platform: macOS
    sources:
      - path: SamsungDisplay
        excludes:
          - Resources/AppIcon.svg
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fp.SamsungDisplay
        INFOPLIST_FILE: SamsungDisplay/Resources/Info.plist
        ENTITLEMENTS_WITHOUT_TEAM_: SamsungDisplay/Resources/SamsungDisplay.entitlements
        CODE_SIGN_ENTITLEMENTS: $(ENTITLEMENTS_WITHOUT_TEAM_$(DEVELOPMENT_TEAM):default=SamsungDisplay/Resources/SamsungDisplay.team.entitlements)
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: SamsungDisplay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          ENABLE_TESTABILITY: NO
  SamsungDisplayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SamsungDisplayTests
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: SamsungDisplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fp.SamsungDisplayTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SamsungDisplay.app/Contents/MacOS/SamsungDisplay"
schemes:
  SamsungDisplay:
    build:
      targets:
        SamsungDisplay: all
        SamsungDisplayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SamsungDisplayTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
