name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIGNING_IDENTITY_NAME: SamsungDisplay Release Signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import the signing certificate
        env:
          P12_BASE64: ${{ secrets.RELEASE_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/release-signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security find-certificate -c "$SIGNING_IDENTITY_NAME" -p "$keychain" > "$RUNNER_TEMP/release-signing.pem"
          security add-trusted-cert -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/release-signing.pem"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/release-signing.p12" "$RUNNER_TEMP/release-signing.pem"

      - name: Build the DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY_NAME }}
        run: scripts/build-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" || true
